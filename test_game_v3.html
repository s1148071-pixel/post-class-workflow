<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍎 The Bee and the Sheep</title>
<style>
/* ============================================================
   edu-game 通用 CSS 骨架 — 所有游戏共用，无需修改
   ============================================================ */
/* --- CSS 变量 --- */
:root {
  --sun: #FFD93D; --grass: #6BCB77; --sky-blue: #4D96FF;
  --purple: #9B59B6; --coral: #FF6B6B; --orange: #FF8C42;
  --dark: #2C3E50; --pink: #FF85A2; --mint: #4ECDC4;
  --card-bg: rgba(255,255,255,0.92); --text-light: #5D6D7E;
}
/* --- 全局 --- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background:linear-gradient(180deg,#5B9BD5 0%,#74B9FF 35%,#A8D8FF 70%,#C5E8FF 100%);
  background-attachment:fixed;min-height:100vh;display:flex;justify-content:center;
  align-items:flex-start;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
#page-bg-photo{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.18;
  background:url('data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7') center/cover no-repeat;}
#bg-deco-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#app{position:relative;z-index:1;width:100%;max-width:600px;padding:12px 14px 24px;display:flex;flex-direction:column;min-height:100vh}
/* --- 进度条 --- */
#progress-bar-wrap{display:none;background:rgba(255,255,255,0.22);backdrop-filter:blur(8px);border-radius:50px;padding:8px 16px;margin-bottom:12px;align-items:center;gap:10px}
#progress-bar-wrap.active{display:flex}
#progress-text{font-size:.8em;font-weight:700;color:#FFF;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.15)}
#progress-outer{flex:1;height:13px;background:rgba(255,255,255,.35);border-radius:7px;overflow:hidden}
#progress-inner{height:100%;width:0;background:linear-gradient(90deg,#74B9FF,#4D96FF,#6BCB77);border-radius:7px;transition:width .5s ease}
#progress-score{font-size:.8em;font-weight:700;color:#FFF;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.15)}
/* --- 页面 --- */
#page-container{flex:1;display:flex;flex-direction:column}
.page{display:none;flex-direction:column;flex:1}
.page.active{display:flex}
/* --- 卡片 --- */
.card{background:var(--card-bg);border-radius:24px;box-shadow:0 8px 32px rgba(30,80,150,.15);border:1px solid rgba(255,255,255,.6);padding:20px 18px;margin-bottom:12px}
.card-title{font-size:1.15em;font-weight:800;color:var(--dark);margin-bottom:10px}
/* --- 关卡 --- */
.level-title{font-size:1.3em;font-weight:800;color:#FFF;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.15)}
.level-hint{font-size:.9em;color:rgba(255,255,255,.85);text-align:center;margin:4px 0 10px}
.level-quiz-card{min-height:52vh;display:flex;flex-direction:column;justify-content:center}
/* --- Toast --- */
.feedback-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 28px;border-radius:50px;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s;font-weight:800;color:#FFF;font-size:1.1em;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.feedback-toast.show{opacity:1}
.feedback-toast.correct{background:var(--grass)}
.feedback-toast.wrong{background:var(--coral)}
/* --- 导航 --- */
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.nav-btn{padding:10px 22px;border-radius:50px;color:#FFF;font-weight:700;font-size:.92em;font-family:inherit;border:none;cursor:pointer;transition:transform .15s,opacity .2s}
.nav-btn:active{transform:scale(.95)}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}
.nav-btn.prev{background:rgba(255,255,255,.25)}
.nav-btn.next{background:var(--grass)}
.nav-btn.next:disabled{background:rgba(255,255,255,.2)}
.nav-btn.home-btn{background:rgba(255,255,255,.3)}
/* --- 大按钮 --- */
.btn-start{display:block;margin:0 auto;padding:14px 44px;background:linear-gradient(135deg,var(--coral),var(--orange));border:none;border-radius:50px;color:#FFF;cursor:pointer;font-weight:800;font-size:1.15em;font-family:inherit;box-shadow:0 6px 20px rgba(255,107,107,.3);transition:transform .2s,box-shadow .2s}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,107,107,.4)}
.btn-start:active{transform:scale(.96)}
/* --- 发音按钮 --- */
.btn-listen{display:inline-block;margin:0 auto 14px;padding:8px 18px;background:linear-gradient(135deg,#4D96FF,#6BB5FF);border:none;border-radius:50px;color:#FFF;cursor:pointer;font-weight:700;font-size:.9em;font-family:inherit;box-shadow:0 3px 12px rgba(77,150,255,.25);transition:transform .15s}
.btn-listen:active{transform:scale(.93)}
/* --- 首页 --- */
.home-header{text-align:center;margin-bottom:10px}
.home-header h1{font-size:1.6em;color:#FFF;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.home-header .subtitle{font-size:.9em;color:rgba(255,255,255,.85)}
.reading-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reading-block{border-radius:18px;padding:14px}
.reading-block-en{background:#EBF5FF;border:1px solid #C5D9F0}
.reading-block-zh{background:#FFF8ED;border:1px solid #F0D9B5}
.reading-block-label{font-size:.75em;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.reading-block-en .reading-block-label{color:var(--sky-blue)}
.reading-block-zh .reading-block-label{color:var(--orange)}
.reading-para{font-size:.9em;line-height:1.6;color:var(--dark);margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed rgba(0,0,0,.08)}
.reading-para:last-child{border-bottom:none}
.reading-para-title{font-weight:800;font-size:1em;color:var(--purple);border-bottom:2px dashed rgba(155,89,182,.3)}
.kw{color:var(--coral);font-weight:800;cursor:pointer;border-bottom:2px dashed rgba(255,107,107,.4);transition:background .2s;padding:1px 3px;border-radius:3px}
.kw:hover{background:rgba(255,107,107,.1)}
.word-table{width:100%;border-collapse:collapse;font-size:.9em}
.word-table th{background:var(--purple);color:#FFF;padding:8px 12px;font-weight:700}
.word-table th:first-child{border-radius:12px 0 0 0}
.word-table th:last-child{border-radius:0 12px 0 0}
.word-table td{padding:8px 12px;text-align:center}
.word-table td:first-child{color:var(--coral);font-weight:700}
.word-table td:nth-child(2){color:var(--text-light)}
.word-table tr:nth-child(even) td{background:rgba(155,89,182,.06)}
/* 词汇网格（3 列卡片） */
.vocab-item{padding:10px 6px;border-radius:14px;background:rgba(255,255,255,.5);transition:transform .15s,background .2s}
.vocab-item:hover{background:rgba(255,255,255,.85);transform:translateY(-2px)}
.vocab-emoji{font-size:1.6em;line-height:1.3}
.vocab-en{font-weight:800;color:var(--coral);font-size:.95em}
.vocab-cn{font-size:.8em;color:var(--text-light)}
/* --- L1: Flashlight --- */
.flashlight-area{position:relative;width:100%;aspect-ratio:1/1;max-height:min(58vh,520px);background:#0a0a1a;border-radius:20px;overflow:hidden;cursor:none;margin:0 auto;flex:1}
.flashlight-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%}
.flashlight-cell{display:flex;align-items:center;justify-content:center;font-size:3em;cursor:none}
.flashlight-overlay{position:absolute;inset:0;background:#000;-webkit-mask-image:radial-gradient(circle 80px at 50% 50%,transparent 0%,#000 80px);mask-image:radial-gradient(circle 80px at 50% 50%,transparent 0%,#000 80px);pointer-events:none}
/* --- L2: Balloon --- */
.balloon-area{position:relative;width:100%;height:40vh;min-height:260px;overflow:hidden;border-radius:20px;background:linear-gradient(180deg,#87CEEB,#E0F7FA)}
.balloon{position:absolute;width:90px;height:110px;cursor:pointer;transition:transform .2s;animation:floatUpDown var(--dur) ease-in-out infinite;animation-delay:var(--delay)}
.balloon-body{width:80px;height:90px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1em;color:#FFF;text-shadow:0 1px 2px rgba(0,0,0,.3);box-shadow:inset -6px -8px 0 rgba(0,0,0,.15);position:relative}
.balloon-body::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid inherit}
.balloon-string{width:2px;height:24px;background:rgba(255,255,255,.5);margin:0 auto}
@keyframes floatUpDown{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes balloonPop{0%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}100%{transform:scale(0);opacity:0}}
@keyframes balloonShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.balloon.pop{animation:balloonPop .4s ease-out forwards;pointer-events:none}
.balloon.shake{animation:balloonShake .4s}
/* --- L3: Visual Spelling --- */
.quiz-stage-lake{background:linear-gradient(180deg,#E0F7FA 0%,#B2EBF2 100%);border-radius:24px;padding:24px 14px}
.quiz-stage-inner{display:flex;flex-direction:column;align-items:center;gap:12px}
.spell-word-panel{margin:6px 0}
.spell-word{font-size:2.8em;letter-spacing:8px;font-weight:800;color:var(--dark);font-family:"Segoe UI","PingFang SC",sans-serif}
.spell-word .blank{display:inline-block;width:50px;height:56px;line-height:56px;background:rgba(255,255,255,.7);border:3px dashed #B0BEC5;border-radius:12px;text-align:center;vertical-align:middle;transition:all .25s;color:var(--coral);margin:0 2px}
.spell-word .blank.filled{border-color:var(--grass);background:rgba(107,203,119,.15);border-style:solid}
.spell-letters-panel{margin-top:6px}
.spell-letters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.spell-letter-btn{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--sky-blue),#6BB5FF);border:none;color:#FFF;font-size:1.4em;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(77,150,255,.3);transition:transform .15s,opacity .2s}
.spell-letter-btn:active{transform:scale(.9)}
.spell-letter-btn.used{opacity:.3;pointer-events:none}
/* --- L4: Scene Choice --- */
.quiz-stage-cake{background:linear-gradient(180deg,#FFF0F5 0%,#FFE4E1 100%);border-radius:24px;padding:24px 14px;position:relative;overflow:hidden}
.quiz-stage-cake::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,133,162,.15) 2px,transparent 2px);background-size:28px 28px;pointer-events:none}
.scene-showcase{position:relative;margin:10px 0}
.scene-glow{width:140px;height:140px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,rgba(255,215,100,.4),transparent 70%);animation:glowPulse 2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.scene-frame{width:150px;height:150px;margin:-120px auto 0;border-radius:50%;border:4px solid rgba(255,255,255,.8);background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.08);position:relative;z-index:1}
.scene-emoji{font-size:5em;animation:sceneBounce 1.8s ease-in-out infinite}
@keyframes sceneBounce{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.06)}60%{transform:translateY(-4px) scale(.98)}}
.scene-sparkles{display:flex;justify-content:center;gap:20px;margin-top:-10px;position:relative;z-index:1}
.scene-sparkles span{font-size:1.4em;animation:sparkleSpin 3s linear infinite}
.scene-sparkles .s1{animation-delay:0s}.scene-sparkles .s2{animation-delay:.8s}.scene-sparkles .s3{animation-delay:1.6s}.scene-sparkles .s4{animation-delay:2.4s}
@keyframes sparkleSpin{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.4)}100%{transform:rotate(360deg) scale(1)}}
.choice-btns{display:flex;gap:14px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.choice-btn{padding:14px 28px;border-radius:50px;border:3px solid #E0D5F0;background:#FFF;cursor:pointer;font-weight:800;font-size:1.2em;font-family:inherit;color:var(--dark);transition:transform .2s,border-color .2s,background .2s}
.choice-btn:hover{border-color:var(--purple)}
.choice-btn:active{transform:scale(.94)}
.choice-btn.correct-pick{background:var(--grass);color:#FFF;border-color:var(--grass);animation:popIn .3s ease-out}
.choice-btn.wrong-pick{background:var(--coral);color:#FFF;border-color:var(--coral);animation:shake .4s}
@keyframes popIn{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* --- L5: Word Scramble --- */
.quiz-stage-face{background:linear-gradient(180deg,#EDE7F6 0%,#D1C4E9 100%);border-radius:24px;padding:24px 14px}
.scramble-meaning-badge{display:inline-block;padding:6px 20px;background:#FFF;border-radius:50px;font-weight:800;font-size:1.1em;color:var(--purple);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.scramble-board{margin-top:8px}
.scramble-answer-panel{margin-bottom:10px}
.scramble-answer-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.scramble-slot{width:54px;height:54px;border:3px dashed #B0BEC5;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5em;font-weight:800;color:var(--coral);background:rgba(255,255,255,.6);transition:all .25s}
.scramble-slot.filled{border-color:var(--grass);border-style:solid;background:rgba(107,203,119,.12)}
.scramble-letters-panel{margin-top:4px}
.scramble-letters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.scramble-tile{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--pink),var(--orange));border:none;color:#FFF;font-size:1.5em;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(255,133,162,.3);transition:transform .15s,opacity .2s}
.scramble-tile:active{transform:scale(.9)}
.scramble-tile.used-tile{opacity:.3;pointer-events:none}
.scramble-tile.wrong-flash{animation:shake .5s;background:var(--coral)}
/* --- L6: Tarot Memory --- */
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:min(100%,440px);width:100%;margin:0 auto}
.memory-card{aspect-ratio:0.72;perspective:800px;cursor:pointer}
.memory-inner{width:100%;height:100%;position:relative;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.memory-card.flipped .memory-inner{transform:rotateY(180deg)}
.memory-card.matched .memory-inner{transform:rotateY(180deg)}
.memory-front,.memory-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:10px 10px 14px 14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.memory-front{background:linear-gradient(165deg,#1a0f2e 0%,#2d1a4a 40%,#1a0f2e 100%);border:2px solid #c9a227;box-shadow:inset 0 0 24px rgba(201,162,39,.25),0 4px 12px rgba(0,0,0,.35);font-size:1.6em}
.memory-front::before{content:'✦';position:absolute;top:8px;font-size:.55em;opacity:.7;color:#e8d5a3}
.memory-front::after{content:'☽';position:absolute;bottom:8px;font-size:.5em;opacity:.6;color:#e8d5a3}
.memory-front .tarot-back-art{font-size:1.4em;opacity:.9;text-shadow:0 0 12px rgba(201,162,39,.6);color:#e8d5a3}
.memory-back{transform:rotateY(180deg);flex-direction:column;border:2px solid #c9a227;box-shadow:inset 0 0 30px rgba(0,0,0,.08)}
.memory-back.tarot-word{background:linear-gradient(180deg,#f5e6c8 0%,#e8d4a8 50%,#dcc89a 100%);font-size:.95em;font-weight:800;color:#3d2914;font-family:Georgia,'Times New Roman',serif;letter-spacing:1px}
.memory-back.tarot-word::before{content:'— ✦ —';font-size:.65em;color:#8b6914;margin-bottom:4px}
.memory-back.tarot-emoji{background:linear-gradient(180deg,#2a1f3d 0%,#1a1228 100%);font-size:2em;border-color:#9b7ddb}
.memory-back.tarot-emoji::after{content:'';position:absolute;inset:6px;border:1px solid rgba(201,162,39,.35);border-radius:6px;pointer-events:none}
.memory-card.matched .memory-back{filter:brightness(1.08)}
/* --- L7: Dreamcatcher --- */
.dreamcatcher-area{position:relative;width:100%;aspect-ratio:1/1;max-height:min(58vh,460px);margin:0 auto;background:radial-gradient(circle at center,rgba(10,10,26,.02),rgba(10,10,26,.25));border-radius:20px;overflow:hidden}
.dreamcatcher-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
.dc-feathers-layer{position:absolute;inset:0;z-index:2}
.dc-center-reveal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;font-size:1.1em;font-weight:700;color:#c9a227}
.dc-feather{position:absolute;width:52px;height:72px;pointer-events:auto;cursor:grab;touch-action:none;z-index:5;transition:filter .3s,transform .25s cubic-bezier(.34,1.4,.64,1);transform-origin:center bottom}
.dc-feather.dragging{cursor:grabbing;z-index:20;filter:drop-shadow(0 6px 16px rgba(255,215,150,.6))}
.dc-feather.woven{pointer-events:none;cursor:default;filter:drop-shadow(0 0 12px rgba(255,220,120,.9));animation:featherGlow 1.5s ease-in-out infinite}
.dc-feather.wrong-drop{animation:shake .45s}
@keyframes featherGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(255,220,120,.7))}50%{filter:drop-shadow(0 0 18px rgba(255,240,180,1))}}
.dc-feather-body{width:100%;height:85%;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;display:flex;align-items:center;justify-content:center;font-size:1.45em;font-weight:800;color:#FFF;text-shadow:0 1px 3px rgba(0,0,0,.3);box-shadow:inset -4px -6px 0 rgba(0,0,0,.12)}
.dc-feather-tail{width:3px;height:18%;margin:0 auto;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);border-radius:2px}
/* --- L8: Constellation --- */
.constellation-canvas{display:block;margin:0 auto;width:100%;max-width:460px;border-radius:20px;background:#0a0a1a}
/* --- L9: Meteor --- */
.meteor-canvas{display:block;margin:0 auto;width:100%;max-width:460px;border-radius:20px;background:#0a0a2e}
/* --- L10: Scratch --- */
.scratch-canvas{display:block;margin:0 auto;border-radius:20px;cursor:pointer;touch-action:none;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.scratch-options{display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.scratch-opt{padding:12px 26px;border-radius:50px;border:3px solid #E0D5F0;background:#FFF;cursor:pointer;font-weight:800;font-size:1.15em;font-family:inherit;color:var(--dark);transition:transform .2s,background .2s}
.scratch-opt:hover{border-color:var(--purple)}
.scratch-opt:active{transform:scale(.94)}
.scratch-opt.correct-pick{background:var(--grass);color:#FFF;border-color:var(--grass)}
.scratch-opt.wrong-pick{background:var(--coral);color:#FFF;border-color:var(--coral);animation:shake .4s}
/* --- 庆祝页 --- */
.celebration{text-align:center;padding:20px 0}
.stars-row{font-size:2.2em;margin-bottom:8px}
.big-score{font-size:3em;font-weight:800;color:#FFF;text-shadow:0 3px 10px rgba(0,0,0,.2);margin:7px 0}
/* --- 背景飘浮 --- */
.bg-deco-emoji{position:absolute;left:var(--x);top:var(--y);font-size:var(--size);opacity:var(--opacity);animation:decoFloat var(--dur) ease-in-out infinite;animation-delay:var(--delay)}
@keyframes decoFloat{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-18px) rotate(3deg)}75%{transform:translateY(-8px) rotate(-3deg)}}
/* --- Confetti --- */
#confetti-canvas{position:fixed;inset:0;z-index:998;pointer-events:none}
/* --- 响应式 --- */
@media(max-width:480px){
  .card{padding:14px 10px}
  .reading-split{grid-template-columns:1fr}
  .flashlight-cell{font-size:2.2em}
  .balloon{width:70px;height:90px}
  .balloon-body{width:62px;height:70px;font-size:.8em}
  .spell-word{font-size:2.4em;letter-spacing:6px}
  .spell-word .blank{width:42px;height:48px;line-height:48px}
  .scene-frame{width:130px;height:130px}
  .scene-emoji{font-size:4.2em}
  .choice-btn{max-width:140px;padding:14px 12px;font-size:1.15em}
  .scramble-tile{width:54px;height:54px}
  .scramble-slot{width:48px;height:48px}
  .spell-letter-btn{width:48px;height:48px;font-size:1.3em}
  .memory-grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .memory-front{font-size:1.2em}
  .memory-back.tarot-word{font-size:.75em}
  .memory-back.tarot-emoji{font-size:1.4em}
  .dc-feather{width:46px;height:64px}
}
</style>
</head>
<body>
<div id="page-bg-photo" aria-hidden="true"></div>

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudioCtx() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }
function playBeep(freq, duration, type = 'sine', vol = 0.15) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}
function sfxCorrect() {
  playBeep(523, 0.12, 'sine', 0.18);
  setTimeout(() => playBeep(659, 0.12, 'sine', 0.16), 90);
  setTimeout(() => playBeep(784, 0.22, 'sine', 0.14), 180);
}
function sfxWrong() { playBeep(200, 0.3, 'square', 0.08); }
function sfxDing() { playBeep(880, 0.25, 'sine', 0.12); setTimeout(() => playBeep(1100, 0.3, 'sine', 0.1), 120); }
function sfxPop() { playBeep(500, 0.08); playBeep(700, 0.12); }
function sfxCheer() {
  const melody = [523, 659, 784, 1047, 784, 1047, 1318];
  melody.forEach((f, i) => setTimeout(() => playBeep(f, 0.22, 'sine', 0.13), i * 110));
  setTimeout(() => {
    for (let i = 0; i < 8; i++)
      setTimeout(() => playBeep(700 + Math.random() * 400, 0.12, 'triangle', 0.09), i * 70);
  }, 900);
}
function speakWord(word) {
  const a = new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=2`);
  a.play().catch(() => {});
}
function makeListenButton(word) {
  return `<button class="btn-listen" data-word="${word}">🔊 听发音</button>`;
}
function bindListenButtons(root) {

/* ============================================================
   Toast / 进度条 / 导航
   ============================================================ */
function showToast(msg, type) {
  const toast = document.getElementById('feedback-toast');
  toast.textContent = msg;
  toast.className = 'feedback-toast ' + type + ' show';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => { toast.classList.remove('show'); }, 1200);
}
function updateProgress() {
  const wrap = document.getElementById('progress-bar-wrap');
  const text = document.getElementById('progress-text');
  const inner = document.getElementById('progress-inner');
  const score = document.getElementById('progress-score');
  if (currentLevel === 0 || currentLevel === 11) { wrap.classList.remove('active'); }
  else {
    wrap.classList.add('active');
    const done = levelScores.filter((s, i) => s > 0 || levelCompleted[i]).length;
    text.textContent = currentLevel + '/10';
    inner.style.width = (done * 10) + '%';
    score.textContent = totalScore + ' 分';
  }
}
function goToLevel(n) {
  if (activeLevelCleanup) { activeLevelCleanup(); activeLevelCleanup = null; }
  if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  if (confettiAnimId) { cancelAnimationFrame(confettiAnimId); confettiAnimId = null; }
  const cc = document.getElementById('confetti-canvas');
  if (cc) { const cfg = cc.getContext('2d'); cfg.clearRect(0, 0, cc.width, cc.height); }
  document.body.classList.remove('celebrating');
  currentLevel = n;
  updateProgress();
  renderLevel(n);
  document.getElementById('app').scrollIntoView({ behavior: 'smooth' });
}
function goNext() {
  if (currentLevel < 10) goToLevel(currentLevel + 1);
  else if (currentLevel === 10) showCelebration();
}
function goPrev() { if (currentLevel > 1) goToLevel(currentLevel - 1); }
function goHome() {
  if (activeLevelCleanup) { activeLevelCleanup(); activeLevelCleanup = null; }
  if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  if (confettiAnimId) { cancelAnimationFrame(confettiAnimId); confettiAnimId = null; }
  const cc = document.getElementById('confetti-canvas');
  if (cc) { const cfg = cc.getContext('2d'); cfg.clearRect(0, 0, cc.width, cc.height); }
  document.body.classList.remove('celebrating');
  currentLevel = 0; updateProgress(); renderHome();
  document.getElementById('app').scrollIntoView({ behavior: 'smooth' });
}
function handleCorrect(levelIdx) {
  sfxCorrect();
  if (levelCompleted[levelIdx]) { showToast('Perfect! ✨', 'correct'); return; }
  levelCompleted[levelIdx] = true;
  levelScores[levelIdx] = 10;
  totalScore = levelScores.reduce((a, b) => a + b, 0);
  updateProgress();
  showToast('Awesome! 🚀', 'correct');
  const nextBtn = document.getElementById('btn-next-' + (levelIdx + 1));
  if (nextBtn) nextBtn.disabled = false;
  autoAdvanceTimer = setTimeout(() => {
    autoAdvanceTimer = null;
    if (levelIdx + 1 < 10) goToLevel(levelIdx + 2);
    else showCelebration();
  }, 800);
}
function handleWrong() { sfxWrong(); showToast('再试一次！🤔', 'wrong'); }

      <div class="card level-quiz-card" id="level-content-${n}"></div>
      <div class="nav-row">
        <button class="nav-btn prev" id="btn-prev-${n}" ${n === 1 ? 'disabled' : ''}>⬅ 上一关</button>
        <button class="nav-btn home-btn" id="btn-home-${n}">🏠 首页</button>
        <button class="nav-btn next" id="btn-next-${n}">下一关 ➡</button>
      </div>
    </div>`;
}
function bindNavButtons(n, app) {
  const prevBtn = document.getElementById('btn-prev-' + n);
  const homeBtn = document.getElementById('btn-home-' + n);
  const nextBtn = document.getElementById('btn-next-' + n);
  if (prevBtn) prevBtn.addEventListener('click', goPrev);
  if (homeBtn) homeBtn.addEventListener('click', goHome);
  if (nextBtn) {
    nextBtn.addEventListener('click', goNext);
    if (!levelCompleted[n - 1]) nextBtn.disabled = true;
  }
}

/* ============================================================

   ============================================================ */

  const title = gameConfig.title || '英语趣味闯关';
  const subtitle = gameConfig.subtitle || '';
  const phonics = gameConfig.phonics || '';
  const storyParas = story.paragraphs || [];

  // 构建故事 HTML
  let enParas = '', zhParas = '';
  storyParas.forEach(p => {
    enParas += `<p class="reading-para">${p.en}</p>`;
    zhParas += `<p class="reading-para">${p.zh}</p>`;
  });
  if (storyParas.length === 0) {
    enParas = '<p class="reading-para" style="color:#999;">（无故事数据）</p>';
    zhParas = '<p class="reading-para" style="color:#999;">（无故事数据）</p>';
  }

  // 3 列词汇网格
  const cols = 3;
  const vocabGrid = VOCAB.map(v => `
    <div class="vocab-item" data-word="${v.en}">
      <div class="vocab-emoji">${v.emoji}</div>
      <div class="vocab-en">${v.en}</div>
      <div class="vocab-cn">${v.cn}</div>
      <button class="btn-listen" data-word="${v.en}" style="margin:0;padding:3px 10px;font-size:0.7em;">🔊</button>
    </div>`).join('');

  container.innerHTML = `
    <div class="page active" id="page-home">
      <div class="home-header">
        <h1>${title}</h1>
        <p class="subtitle">${phonics ? '「' + phonics + '」· ' : ''}${subtitle}</p>
      </div>
      <div class="card reading-card">
        <div class="card-title">📖 故事阅读 <span style="font-size:0.7em;color:#999;">（点击高亮单词听发音）</span></div>
        <div class="reading-split">
          <div class="reading-block reading-block-en">
            <div class="reading-block-label">English</div>
            ${enParas}
          </div>
          <div class="reading-block reading-block-zh">
            <div class="reading-block-label">中文</div>
            ${zhParas}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">📋 目标词汇 <span style="font-size:0.7em;color:#999;">（点击听发音）</span></div>
        <div class="vocab-grid" style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:10px;text-align:center;">
          ${vocabGrid}
        </div>
      </div>
      <button class="btn-start" id="btn-start-game">🚀 开始挑战！</button>
    </div>`;
  bindListenButtons(container);
  // 点击高亮词发音
  container.querySelectorAll('.kw').forEach(kw => {
    kw.addEventListener('click', (e) => { e.stopPropagation(); speakWord(kw.dataset.word); });
  });
  // 点击词汇卡片发音
  container.querySelectorAll('.vocab-item').forEach(item => {
    item.addEventListener('click', () => { speakWord(item.dataset.word); });
    item.style.cursor = 'pointer';
  });
  document.getElementById('btn-start-game').addEventListener('click', () => {
    getAudioCtx().resume(); goToLevel(1);
  });
}

/* ============================================================
   关卡分发 + 数据读取
   ============================================================ */
function getLevelData(n) {
  // n 是 1-based 关卡号，levels 数组 0-based
  const idx = n - 1;
  if (levels[idx]) return levels[idx];
  // fallback: 如果是旧格式（gameType 在顶层），尝试匹配
  const found = levels.find(l => (l.id === n || l.id === String(n)));
  return found || levels[idx] || {};
}

function renderLevel(n) {
  const app = document.getElementById('page-container');
  const lvl = getLevelData(n);
  const gt = lvl.gameType || '';
  switch (gt) {
    case 'balloonPop':     renderLevel1(app, n, lvl); break;
    case 'flashlight':     renderLevel2(app, n, lvl); break;
    case 'sceneChoice':    renderLevel3(app, n, lvl); break;
    case 'visualSpelling': renderLevel4(app, n, lvl); break;
    case 'wordScramble':   renderLevel5(app, n, lvl); break;
    case 'memoryMatch':    renderLevel6(app, n, lvl); break;
    case 'meteorCatcher':  renderLevel7(app, n, lvl); break;
    case 'constellation':  renderLevel8(app, n, lvl); break;
    case 'dreamcatcher':   renderLevel9(app, n, lvl); break;
    case 'scratchCard':    renderLevel10(app, n, lvl); break;
    default: renderLevelFallback(app, n, lvl);
  }
}

function renderLevelFallback(app, n, lvl) {
  app.innerHTML = makeLevelContainer(n, lvl.title || '第' + n + '关', lvl.hint || '');
  const content = document.getElementById('level-content-' + n);
  content.innerHTML = `<div style="text-align:center;padding:40px;color:#999;">⚠️ 未知游戏类型: ${lvl.gameType || '(未指定)'}</div>`;
  activeLevelCleanup = null; bindNavButtons(n, app);
}

/* ---- L7: Meteor Catcher (meteorCatcher) — Bug#5 保底计数器 ---- */
function renderLevel7(app, n, lvl) {
  const LVL = n;
  const TARGET = { en: lvl.targetWord || '', cn: lvl.targetMeaning || '' };

  app.innerHTML = makeLevelContainer(LVL, lvl.title || '接流星', lvl.hint || '🌠 接住中文提示对应的英文单词流星！');

    </div>
    <canvas class="meteor-canvas" id="meteor-canvas" width="460" height="610"></canvas>`;
  bindListenButtons(content);

  const canvas = document.getElementById('meteor-canvas');
  const ctx3 = canvas.getContext('2d');
  const W3 = 460, H3 = 610, catcher = { x: W3/2, y: H3 - 60, w: 100, h: 20 };
  let meteors = [], animId, meteorInterval, meteorSpawnCount = 0;
  const allWords = VOCAB.map(v => v.en);

  function spawnMeteor() {
    let word;
    if (meteorSpawnCount >= 6) {
      word = TARGET.en; meteorSpawnCount = 0;
    } else {
      word = allWords[Math.floor(Math.random() * allWords.length)];
      if (word !== TARGET.en) meteorSpawnCount++;
    }
    return {
      x: 40 + Math.random() * (W3 - 80), y: -30, word,
      speed: 0.8 + Math.random() * 1.2,
      color: ['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#FF85A2','#FF8C42','#4ECDC4'][Math.floor(Math.random() * 7)],
      opacity: 1,
    };
  }

  const starLayer = document.createElement('canvas'); starLayer.width = W3; starLayer.height = H3;
  const starCtx = starLayer.getContext('2d');
  for (let i = 0; i < 80; i++) {
    starCtx.fillStyle = `rgba(255,255,255,${0.3 + Math.random()*0.5})`;
    starCtx.beginPath(); starCtx.arc(Math.random()*W3, Math.random()*H3, 1+Math.random()*2, 0, Math.PI*2); starCtx.fill();
  }
  starCtx.fillStyle = 'rgba(255,255,200,0.6)';
  starCtx.beginPath(); starCtx.arc(W3 - 80, 70, 35, 0, Math.PI*2); starCtx.fill();
  starCtx.fillStyle = '#0a0a2e'; starCtx.beginPath(); starCtx.arc(W3 - 68, 62, 30, 0, Math.PI*2); starCtx.fill();

  function drawMeteor() {
    ctx3.clearRect(0, 0, W3, H3); ctx3.drawImage(starLayer, 0, 0);
    meteors.forEach(m => {
      ctx3.globalAlpha = m.opacity; ctx3.fillStyle = m.color;
      ctx3.font = 'bold 18px "Segoe UI","PingFang SC",sans-serif'; ctx3.textAlign = 'center';
      ctx3.fillText(m.word, m.x, m.y);
      ctx3.font = '28px "Segoe UI Emoji","PingFang SC",sans-serif'; ctx3.fillText('🌠', m.x, m.y - 26);
      ctx3.globalAlpha = 1;
    });
    ctx3.fillStyle = 'rgba(255,255,255,0.85)'; ctx3.fillRect(catcher.x - catcher.w/2, catcher.y, catcher.w, catcher.h);
    ctx3.fillStyle = '#FFF'; ctx3.font = 'bold 12px "Segoe UI","PingFang SC",sans-serif';
    ctx3.textAlign = 'center'; ctx3.fillText('⬅ 接住流星 ➡', catcher.x, catcher.y + catcher.h/2 + 5);
  }

  function update() {
    meteors.forEach(m => {
      m.y += m.speed;
      if (m.y > catcher.y && m.y < catcher.y + catcher.h + 30 && m.x > catcher.x - catcher.w/2 && m.x < catcher.x + catcher.w/2) {
        if (m.word === TARGET.en) { sfxCorrect(); handleCorrect(LVL - 1); }
        else { handleWrong(); }
        m.y = H3 + 50;
      }
    });
    meteors = meteors.filter(m => m.y < H3 + 50);
  }

  function loop() { update(); drawMeteor(); animId = requestAnimationFrame(loop); }

  meteorInterval = setInterval(() => { if (meteors.length < 5) meteors.push(spawnMeteor()); }, 1200);
  for (let i = 0; i < 3; i++) meteors.push(spawnMeteor());

  canvas.addEventListener('mousemove', (e) => { const rect = canvas.getBoundingClientRect(); catcher.x = (e.clientX - rect.left) * (W3 / rect.width); });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const rect = canvas.getBoundingClientRect(); catcher.x = (e.touches[0].clientX - rect.left) * (W3 / rect.width); }, { passive: false });

  loop();
  activeLevelCleanup = () => { cancelAnimationFrame(animId); clearInterval(meteorInterval); };
  bindNavButtons(LVL, app);
}

/* ---- L8: Constellation (constellation) — Bug#7 字母值匹配 ---- */
function renderLevel8(app, n, lvl) {
  const LVL = n;
  const TARGET = lvl.targetWord || '';

  app.innerHTML = makeLevelContainer(LVL, lvl.title || '星座连线', lvl.hint || '⭐ 按字母顺序点击星星！');
  const content = document.getElementById('level-content-' + LVL);
  content.innerHTML = `
    <div style="text-align:center;margin-bottom:8px;">
      <span style="font-size:1.1em;font-weight:700;color:var(--dark);">拼出：<span style="color:var(--coral);">${getCN(TARGET)} ${getEmoji(TARGET)}</span></span>
    </div>
    <canvas class="constellation-canvas" id="constellation-canvas" width="460" height="460"></canvas>`;
  bindListenButtons(content);

  const canvas = document.getElementById('constellation-canvas');
  const ctx2 = canvas.getContext('2d');
  const W2 = 460, H2 = 460, cx = W2/2, cy = H2/2;
  const letters = TARGET.split('');
  const starPositions = letters.map((letter, i) => {
    const angle = (i / letters.length) * Math.PI * 2 - Math.PI/2;
    return { x: cx + Math.cos(angle) * 140, y: cy + Math.sin(angle) * 140, letter, idx: i };
  });

  let nextIdx = 0, connected = [];
  const starField = document.createElement('canvas'); starField.width = W2; starField.height = H2;
  const sctx = starField.getContext('2d');
  for (let i = 0; i < 80; i++) {
    sctx.fillStyle = `rgba(255,255,255,${0.2 + Math.random()*0.5})`;
    sctx.beginPath(); sctx.arc(Math.random()*W2, Math.random()*H2, 0.5+Math.random()*2, 0, Math.PI*2); sctx.fill();
  }

  function drawConstellation() {
    ctx2.clearRect(0, 0, W2, H2); ctx2.drawImage(starField, 0, 0);
    starPositions.forEach((s) => {
      const isConnected = connected.includes(s);
      ctx2.beginPath(); ctx2.arc(s.x, s.y, isConnected ? 22 : 20, 0, Math.PI*2);
      ctx2.fillStyle = isConnected ? '#6BCB77' : '#FFE066'; ctx2.fill();
      ctx2.shadowColor = isConnected ? '#6BCB77' : '#FFE066'; ctx2.shadowBlur = isConnected ? 20 : 12; ctx2.fill();
      ctx2.shadowBlur = 0;
      ctx2.fillStyle = isConnected ? '#FFF' : '#3D2B00';
      ctx2.font = 'bold 16px "Segoe UI","PingFang SC",sans-serif'; ctx2.textAlign = 'center'; ctx2.textBaseline = 'middle';
      ctx2.fillText(s.letter, s.x, s.y);
    });
    if (connected.length > 1) {
      ctx2.beginPath(); ctx2.strokeStyle = '#FFE066'; ctx2.lineWidth = 3; ctx2.shadowColor = '#FFE066'; ctx2.shadowBlur = 8;
      connected.forEach((s, i) => { if (i === 0) ctx2.moveTo(s.x, s.y); else ctx2.lineTo(s.x, s.y); });
      ctx2.stroke(); ctx2.shadowBlur = 0;
    }
  }
  drawConstellation();

  function handleStarTap(ex, ey) {
    if (nextIdx >= letters.length) return;
    let hitStar = null;
    // Bug#7: 字母值扫描，支持重复字母
    for (let i = 0; i < starPositions.length; i++) {
      if (connected.includes(starPositions[i])) continue;
      if (starPositions[i].letter !== letters[nextIdx]) continue;
      if (Math.hypot(ex - starPositions[i].x, ey - starPositions[i].y) < 45) {
        hitStar = starPositions[i]; break;
      }
    }
    if (hitStar) {
      connected.push(hitStar); nextIdx++; drawConstellation(); sfxPop();
      if (nextIdx === letters.length) { handleCorrect(LVL - 1); }
    } else {
      let hitWrong = false;
      for (let i = 0; i < starPositions.length; i++) {
        if (connected.includes(starPositions[i])) continue;
        if (Math.hypot(ex - starPositions[i].x, ey - starPositions[i].y) < 45) { hitWrong = true; break; }
      }
      if (hitWrong) { nextIdx = 0; connected.length = 0; drawConstellation(); handleWrong(); }
    }
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    handleStarTap((e.clientX - rect.left) * (W2 / rect.width), (e.clientY - rect.top) * (H2 / rect.height));
  });
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    handleStarTap((e.touches[0].clientX - rect.left) * (W2 / rect.width), (e.touches[0].clientY - rect.top) * (H2 / rect.height));
  }, { passive: false });

  activeLevelCleanup = null; bindNavButtons(LVL, app);
}

  content.innerHTML = `
    <div style="text-align:center;margin-bottom:8px;">
      <span style="font-size:1.1em;font-weight:700;color:var(--dark);">拼出中文：<span style="color:var(--coral);">${getCN(TARGET)}</span></span>
    </div>
    <div class="dreamcatcher-area" id="dreamcatcher-area">
      <canvas class="dreamcatcher-canvas" id="dc-canvas" width="460" height="460"></canvas>
      <div class="dc-feathers-layer" id="dc-feathers"></div>
      <div class="dc-center-reveal" id="dc-center"></div>
    </div>`;
  bindListenButtons(content);

  const area = document.getElementById('dreamcatcher-area');
  const feathersEl = document.getElementById('dc-feathers');
  const centerReveal = document.getElementById('dc-center');
  const canvas = document.getElementById('dc-canvas');
  const ctx = canvas.getContext('2d');
  const W = 460, H = 460;

  function drawDreamcatcher() {
    ctx.clearRect(0, 0, W, H);
    const cx = W/2, cy = H/2, outerR = 120;
    ctx.beginPath(); ctx.arc(cx, cy, outerR, 0, Math.PI*2); ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, outerR-8, 0, Math.PI*2); ctx.strokeStyle = 'rgba(201,162,39,0.4)'; ctx.lineWidth = 1; ctx.stroke();
    for (let i = 0; i < 8; i++) { const angle = (i/8)*Math.PI*2 - Math.PI/2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx+Math.cos(angle)*outerR, cy+Math.sin(angle)*outerR); ctx.strokeStyle = 'rgba(201,162,39,0.3)'; ctx.lineWidth = 1; ctx.stroke(); }
    for (let r = 20; r < outerR; r += 20) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.strokeStyle = 'rgba(201,162,39,0.2)'; ctx.lineWidth = 0.5; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI*2); ctx.fillStyle = 'rgba(201,162,39,0.15)'; ctx.fill(); ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '14px "Segoe UI","PingFang SC",sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✨ 拖入羽毛 ✨', cx, cy + 60);
  }
  drawDreamcatcher();

  const areaRect = area.getBoundingClientRect(); const areaW = areaRect.width, areaH = areaRect.height;

  feathersEl.innerHTML = letters.map((letter, i) => {
    const angle = (i / letters.length) * Math.PI * 2 - Math.PI/2;
    const lx = 50 + Math.cos(angle) * 28, ly = 50 + Math.sin(angle) * 28;  // Bug#13: 轨道半径 28（非 36）
    return `<div class="dc-feather" id="feather-${i}" data-letter="${letter}" data-idx="${i}"
      style="left:${lx}%;top:${ly}%;transform:translate(-50%,-50%) rotate(${angle*180/Math.PI+90}deg);">
      <div class="dc-feather-body" style="background:linear-gradient(180deg,${featherColors[i] || featherColors[0]},${(featherColors[i] || featherColors[0])}dd);">${letter}</div>
      <div class="dc-feather-tail"></div></div>`;
  }).join('');

  let wovenCount = 0, activeDragFeather = null, dragStartX = 0, dragStartY = 0, featherStartLeft = 0, featherStartTop = 0;

  function updateCenterDisplay() {
    const woven = []; document.querySelectorAll('.dc-feather.woven').forEach(el => { woven.push(el.dataset.letter); });
    centerReveal.textContent = woven.join('') || '✨ 拖入羽毛 ✨';
  }

  area.addEventListener('mousedown', (e) => {
    const feather = e.target.closest('.dc-feather'); if (!feather || feather.classList.contains('woven')) return;
    activeDragFeather = feather; feather.classList.add('dragging');
    dragStartX = e.clientX; dragStartY = e.clientY; featherStartLeft = feather.offsetLeft; featherStartTop = feather.offsetTop;
    e.preventDefault();
  });
  area.addEventListener('touchstart', (e) => {
    const feather = e.target.closest('.dc-feather'); if (!feather || feather.classList.contains('woven')) return;
    activeDragFeather = feather; feather.classList.add('dragging');
    dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY; featherStartLeft = feather.offsetLeft; featherStartTop = feather.offsetTop;
  }, { passive: false });
  document.addEventListener('mousemove', (e) => {
    if (!activeDragFeather) return;
    const r = area.getBoundingClientRect(); const scale = r.width / areaW;
    activeDragFeather.style.left = (featherStartLeft + (e.clientX - dragStartX) / scale) + 'px';
    activeDragFeather.style.top = (featherStartTop + (e.clientY - dragStartY) / scale) + 'px';
    activeDragFeather.style.transform = 'translate(-50%,-50%)';
  });
  document.addEventListener('touchmove', (e) => {
    if (!activeDragFeather) return;
    const r = area.getBoundingClientRect(); const scale = r.width / areaW;
    activeDragFeather.style.left = (featherStartLeft + (e.touches[0].clientX - dragStartX) / scale) + 'px';
    activeDragFeather.style.top = (featherStartTop + (e.touches[0].clientY - dragStartY) / scale) + 'px';
    activeDragFeather.style.transform = 'translate(-50%,-50%)';
  }, { passive: false });

  function endDrag() {
    const feather = activeDragFeather;
    const r = area.getBoundingClientRect(); const center = { x: r.width/2, y: r.height/2 };
    const fRect = feather.getBoundingClientRect();
    const fx = fRect.left + fRect.width/2 - r.left, fy = fRect.top + fRect.height/2 - r.top;
    const dist = Math.hypot(fx - center.x, fy - center.y);
    // Bug#6: 字母值匹配（非 idx 匹配），支持重复字母
    if (dist < 70 && feather.dataset.letter === letters[wovenCount]) {
      feather.classList.add('woven'); feather.style.left = '50%'; feather.style.top = '50%';
      feather.style.transform = 'translate(-50%,-50%) rotate(0deg)'; sfxPop(); wovenCount++; updateCenterDisplay();
      if (wovenCount === letters.length) { handleCorrect(LVL - 1); }
    } else {
      feather.classList.add('wrong-drop'); setTimeout(() => feather.classList.remove('wrong-drop'), 450); handleWrong();
      const idx = parseInt(feather.dataset.idx);
      const angle = (idx / letters.length) * Math.PI * 2 - Math.PI/2;
      feather.style.left = (50 + Math.cos(angle) * 28) + '%'; feather.style.top = (50 + Math.sin(angle) * 28) + '%';
      feather.style.transform = `translate(-50%,-50%) rotate(${angle*180/Math.PI+90}deg)`;
    }
    feather.classList.remove('dragging'); activeDragFeather = null;
  }

  document.addEventListener('mouseup', () => { if (activeDragFeather) endDrag(); });
  document.addEventListener('touchend', () => { if (activeDragFeather) endDrag(); });

  activeLevelCleanup = null; bindNavButtons(LVL, app);
}

/* ---- L10: Scratch Card (scratchCard) — 6 个独立占位符 → JSON 字段 ---- */
function renderLevel10(app, n, lvl) {
  const LVL = n;
  const ANSWER = lvl.correctWord || '';
  const WRONG = lvl.wrongWord || '';
  const sceneTitle = lvl.sceneTitle || '🎁 刮开看看！';
  const sceneQuestion = lvl.sceneQuestion || '你能猜出是什么吗？';
  const sceneEmoji = lvl.sceneEmoji || '🎁';
  const sceneBottomText = lvl.sceneBottomText || '💡 答案是什么？';
  const bgColor1 = lvl.bgColor1 || '#FFF8ED';
  const bgColor2 = lvl.bgColor2 || '#FFE4D0';

  app.innerHTML = makeLevelContainer(LVL, lvl.title || '魔法刮刮卡', lvl.hint || '🪄 刮开迷雾！');
  const content = document.getElementById('level-content-' + LVL);
  content.innerHTML = `
    <canvas class="scratch-canvas" id="scratch-canvas" width="380" height="380"></canvas>
    <p style="text-align:center;margin-top:6px;color:#999;font-size:0.85em;">用手指刮开灰色区域，刮开超过 60% 后选择答案</p>
    <div class="scratch-options" id="scratch-options" style="display:none;">
      <button class="scratch-opt" data-word="${ANSWER}">${ANSWER}</button>
      <button class="scratch-opt" data-word="${WRONG}">${WRONG}</button>
    </div>`;

  const canvas = document.getElementById('scratch-canvas');
  const ctx4 = canvas.getContext('2d');
  const W4 = 380, H4 = 380;
  canvas.width = W4; canvas.height = H4;

  function drawUnderlay() {
    const skyGrad = ctx4.createLinearGradient(0, 0, 0, H4);
    skyGrad.addColorStop(0, bgColor1); skyGrad.addColorStop(1, bgColor2);
    ctx4.fillStyle = skyGrad; ctx4.fillRect(0, 0, W4, H4);
    ctx4.fillStyle = '#9B59B6'; ctx4.font = 'bold 22px "Segoe UI","PingFang SC",sans-serif'; ctx4.textAlign = 'center';
    ctx4.fillText(sceneTitle, W4/2, 40);
    ctx4.fillStyle = '#5D6D7E'; ctx4.font = 'bold 16px "Segoe UI","PingFang SC",sans-serif';
    ctx4.fillText(sceneQuestion, W4/2, 75);
    ctx4.fillStyle = '#FFD93D'; ctx4.beginPath(); ctx4.ellipse(W4/2, H4/2 + 40, 140, 80, 0, 0, Math.PI*2); ctx4.fill();
    ctx4.font = '120px "Segoe UI Emoji","PingFang SC",sans-serif'; ctx4.textAlign = 'center';
    ctx4.fillText(sceneEmoji, W4/2, H4/2 + 20);
    ctx4.fillStyle = '#6BCB77'; ctx4.fillRect(0, H4 - 45, W4, 45);
    ctx4.fillStyle = '#2C3E50'; ctx4.font = 'bold 16px "Segoe UI","PingFang SC",sans-serif';
    ctx4.fillText(sceneBottomText, W4/2, H4 - 18);
  }

  function createScratchLayer() {
    ctx4.fillStyle = '#555'; ctx4.fillRect(0, 0, W4, H4);
    for (let i = 0; i < 40; i++) { ctx4.fillStyle = `rgba(255,255,255,${0.1+Math.random()*0.2})`; ctx4.beginPath(); ctx4.arc(Math.random()*W4, Math.random()*H4, 2+Math.random()*3, 0, Math.PI*2); ctx4.fill(); }
    ctx4.fillStyle = '#666'; ctx4.font = '20px "Segoe UI","PingFang SC",sans-serif'; ctx4.textAlign = 'center'; ctx4.fillText('🪄 刮开这里！', W4/2, H4/2);
  }

  drawUnderlay();
  const underlayData = ctx4.getImageData(0, 0, W4, H4);
  createScratchLayer();
  const scratchData = ctx4.getImageData(0, 0, W4, H4);

  let isScratching = false, scratchedPixels = 0;
  const totalPixels = W4 * H4, scratchedSet = new Set();

  function scratch(x, y, radius) {
    const r = Math.floor(radius), cx = Math.floor(x), cy = Math.floor(y);
    let newlyScratched = 0;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx*dx + dy*dy <= r*r) {
          const px = cx + dx, py = cy + dy;
          if (px >= 0 && px < W4 && py >= 0 && py < H4) {
            const key = py * W4 + px;
            if (!scratchedSet.has(key)) { scratchedSet.add(key); newlyScratched++; const idx = key * 4; scratchData.data[idx] = underlayData.data[idx]; scratchData.data[idx+1] = underlayData.data[idx+1]; scratchData.data[idx+2] = underlayData.data[idx+2]; scratchData.data[idx+3] = underlayData.data[idx+3]; }
          }
        }
      }
    }
    if (newlyScratched > 0) { scratchedPixels += newlyScratched; ctx4.putImageData(scratchData, 0, 0); if (Math.floor((scratchedPixels / totalPixels) * 100) >= 60) { sfxPop(); document.getElementById('scratch-options').style.display = 'flex'; } }
  }

  function getPos(e) { const rect = canvas.getBoundingClientRect(); const sx = W4 / rect.width, sy = H4 / rect.height; const cx = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left; const cy = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top; return { x: cx * sx, y: cy * sy }; }

  canvas.addEventListener('mousedown', (e) => { isScratching = true; const p = getPos(e); scratch(p.x, p.y, 25); });
  canvas.addEventListener('mousemove', (e) => { if (isScratching) { const p = getPos(e); scratch(p.x, p.y, 25); } });
  canvas.addEventListener('mouseup', () => { isScratching = false; });
  canvas.addEventListener('mouseleave', () => { isScratching = false; });
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isScratching = true; const p = getPos(e.touches[0]); scratch(p.x, p.y, 25); }, {passive: false});
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (isScratching) { const p = getPos(e.touches[0]); scratch(p.x, p.y, 25); } }, {passive: false});
  canvas.addEventListener('touchend', () => { isScratching = false; });

  document.querySelectorAll('.scratch-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.word === ANSWER) { btn.classList.add('correct-pick'); handleCorrect(LVL - 1); }
      else { btn.classList.add('wrong-pick'); setTimeout(() => btn.classList.remove('wrong-pick'), 400); handleWrong(); }
    });
  });
  activeLevelCleanup = null; bindNavButtons(LVL, app);
}

/* ============================================================
   庆祝/鼓励页
   ============================================================ */
function showCelebration() {
  if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
  if (confettiAnimId) { cancelAnimationFrame(confettiAnimId); confettiAnimId = null; }
  currentLevel = 11; updateProgress();
  const container = document.getElementById('page-container');
  const vocabWords = VOCAB.map(v => v.en);

  if (totalScore < 50) {
    document.body.classList.remove('celebrating');
    container.innerHTML = `
      <div class="page active" id="page-celebrate">
        <div class="celebration">
          <div class="stars-row">💪🤗💪</div>
          <h1 style="font-size:1.8em;color:#FFF;text-shadow:0 2px 8px rgba(0,0,0,.15);">继续加油！</h1>
          <p style="color:rgba(255,255,255,.95);font-size:1.15em;margin:4px 0;">Keep Practicing!</p>
          <div class="big-score">${totalScore} / 100</div>
          <p style="color:#FFF;font-size:1.1em;margin:10px 0;">差一点就成功了，再试一次吧！</p>
          <div class="card" style="margin-top:16px;">
            <div class="card-title">📋 成绩单</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
              ${vocabWords.map((w, i) => `<span style="padding:8px 14px;border-radius:20px;font-weight:700;font-size:.95em;background:${levelScores[i]===10?'#6BCB77':'#eee'};color:${levelScores[i]===10?'#FFF':'#999'};">${w} ${levelScores[i]===10?'✅':'❌'}</span>`).join('')}
            </div>
          </div>
          <button class="btn-start" style="margin-top:16px;" id="btn-restart">🔄 再来一次</button>
        </div>
      </div>`;
    document.getElementById('btn-restart').addEventListener('click', () => { totalScore = 0; levelScores = new Array(10).fill(0); levelCompleted = new Array(10).fill(false); goHome(); });
    return;
  }

  document.body.classList.add('celebrating'); sfxCheer();
  container.innerHTML = `
    <div class="page active" id="page-celebrate">
      <div class="celebration">
        <div class="stars-row">🎉🏆🎉</div>
        <h1 style="font-size:2em;color:#FFF;text-shadow:0 2px 8px rgba(0,0,0,.15);">太棒了！</h1>
        <p style="color:rgba(255,255,255,.95);font-size:1.2em;margin:4px 0;">Excellent Work!</p>
        <div class="big-score">${totalScore} / 100</div>
        <div class="card" style="margin-top:16px;">
          <div class="card-title">📋 成绩单</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
            ${vocabWords.map((w, i) => `<span style="padding:8px 14px;border-radius:20px;font-weight:700;font-size:.95em;background:${levelScores[i]===10?'#6BCB77':'#eee'};color:${levelScores[i]===10?'#FFF':'#999'};">${w} ${levelScores[i]===10?'✅':'❌'}</span>`).join('')}
          </div>
        </div>
        <button class="btn-start" style="margin-top:16px;" id="btn-restart">🔄 再来一次</button>
        <button class="btn-start" style="margin-top:8px;background:linear-gradient(135deg,var(--sky-blue),var(--mint));" id="btn-review">📖 复习单词</button>
      </div>
    </div>`;
  document.getElementById('btn-restart').addEventListener('click', () => { totalScore = 0; levelScores = new Array(10).fill(0); levelCompleted = new Array(10).fill(false); goHome(); });
  document.getElementById('btn-review').addEventListener('click', () => { goHome(); });

  // 4 轮 staggered confetti（3 形状: rect/circle/ribbon）
  const cc = document.getElementById('confetti-canvas'); cc.width = window.innerWidth; cc.height = window.innerHeight;
  const cfg = cc.getContext('2d');
  const colors = ['#FFE66D','#7ED957','#6BB5FF','#B57EDC','#FFAA5C','#FF8FAB','#FF6B6B'];
  let confettiParts = [], confettiStopped = false;

  function spawnBurst(count) {
    for (let i = 0; i < count; i++) {
      const shape = Math.floor(Math.random() * 3); // 0=rect 1=circle 2=ribbon
      confettiParts.push({
        x: Math.random() * cc.width, y: -20 - Math.random() * 60,
        w: shape === 2 ? 14 : (5 + Math.random() * 8),
        h: shape === 2 ? 5 : (5 + Math.random() * 8),
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 5, vy: 2 + Math.random() * 5,
        rotation: Math.random() * 360, vr: (Math.random() - 0.5) * 8,
        shape: shape,
      });
    }
  }
  spawnBurst(55);
  setTimeout(() => { if (!confettiStopped) spawnBurst(50); }, 500);
  setTimeout(() => { if (!confettiStopped) spawnBurst(45); }, 900);
  setTimeout(() => { if (!confettiStopped) spawnBurst(40); }, 1300);

  function drawConfetti() {
    if (confettiStopped) { cfg.clearRect(0, 0, cc.width, cc.height); return; }
    cfg.clearRect(0, 0, cc.width, cc.height);
    for (let i = confettiParts.length - 1; i >= 0; i--) {
      const p = confettiParts[i];
      cfg.save(); cfg.translate(p.x, p.y); cfg.rotate(p.rotation * Math.PI / 180);
      cfg.fillStyle = p.color;
      if (p.shape === 1) { cfg.beginPath(); cfg.arc(0, 0, p.w / 2, 0, Math.PI * 2); cfg.fill(); }
      else { cfg.fillRect(-p.w/2, -p.h/2, p.w, p.h); }
      cfg.restore();
      p.x += p.vx; p.y += p.vy; p.rotation += p.vr; p.vy += 0.03;
      if (p.y > cc.height + 40) confettiParts.splice(i, 1);
    }
    confettiAnimId = requestAnimationFrame(drawConfetti);
  }
  drawConfetti();
  // cleanup 兼容 goHome/goToLevel 的 cancelAnimationFrame
}

/* ============================================================
   背景装饰 + 初始化
   ============================================================ */
function initBgDecoLayer() {
  const layer = document.getElementById('bg-deco-layer');
  layer.innerHTML = VOCAB_BG_DECO.map(d => `<span class="bg-deco-emoji" style="--x:${d.x};--y:${d.y};--size:${d.size};--opacity:${d.opacity};--delay:${d.delay};--dur:${d.dur};left:${d.x};top:${d.y};font-size:${d.size};opacity:${d.opacity};animation-delay:${d.delay};animation-duration:${d.dur};">${d.emoji}</span>`).join('');
}

function init() {
  initBgDecoLayer();
  // 动态背景图（从 GAME_DATA 注入）
  if (gameConfig.bgPhoto) {
    document.getElementById('page-bg-photo').style.backgroundImage = `url('${gameConfig.bgPhoto}')`;
  }
  document.getElementById('page-container').addEventListener('click', (e) => {
    const kw = e.target.closest('.kw'); if (kw) { e.stopPropagation(); speakWord(kw.dataset.word); }
    const listenBtn = e.target.closest('.btn-listen'); if (listenBtn) { e.stopPropagation(); speakWord(listenBtn.dataset.word); }
  });
  renderHome();
}

window.addEventListener('DOMContentLoaded', init);
